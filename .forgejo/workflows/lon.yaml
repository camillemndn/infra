name: Update sources

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: native
    env:
      LON_TOKEN: ${{ secrets.LON_TOKEN }}
      BRANCH: lon/update
      URL: ${{ github.server_url }}/${{ github.repository }}
      API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
    steps:
      - name: Checkout main
        run: |
          git init -q .
          git remote add origin "$URL"
          # The token pushes the update branch. Scoped to Forgejo: lon also queries
          # every upstream over HTTPS, and they must not receive it.
          git config "http.${{ github.server_url }}/.extraHeader" "Authorization: basic $(printf 'x-access-token:%s' "$LON_TOKEN" | base64 -w0)"
          git fetch -q origin main
          git checkout -q -B main FETCH_HEAD
          git checkout -q -B "$BRANCH"

      - name: Set up signing
        env:
          BOT_SSH_KEY: ${{ secrets.BOT_SSH_KEY }}
        run: |
          key=$RUNNER_TEMP/signing-key
          (umask 077 && printf '%s\n' "$BOT_SSH_KEY" > "$key")
          # A per-job global config: the runner's home is shared between jobs.
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
          export GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig
          git config --global user.name lon-bot
          git config --global user.email lon-bot@git.mndn.fr
          git config --global gpg.format ssh
          git config --global user.signingKey "$key"
          git config --global commit.gpgSign true

      # The bot's commits pass the same hooks as camille's: formatting and message format.
      - name: Install the repository's git hooks
        run: |
          nix develop -c true
          cat > "$RUNNER_TEMP/commit" <<'EOF'
          # A hook that reformats a file refuses the commit; the second attempt carries the fix.
          git commit -q "$@" || { git add -u && git commit -q "$@"; }
          EOF

      - name: Update sources
        # The lon of the repo's own nixpkgs-unstable pin, the one that wrote lon.nix.
        run: |
          if ! out=$(nix shell --impure --expr '(import (import ./inputs.nix).nixpkgs-unstable { }).lon' \
            -c lon update --continue --commit 2>&1); then
            echo "$out"
            grep -q 'No updates available' <<< "$out" || exit 1
          fi
          echo "$out"

          # lon commits on its own, past the hooks and under its own subject; its body is kept.
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse main)" ]; then
            body=$(git log -1 --format=%b)
            git reset -q --soft HEAD~1
            bash "$RUNNER_TEMP/commit" -m "chore(deps): update" -m "$body"
          fi

      # A source whose patches are generated rather than written by hand keeps the
      # script that regenerates them in patches/<source>/update.sh.
      - name: Run update hooks
        run: |
          # Their nix-shell resolves <nixpkgs>, which the runner does not set.
          NIX_PATH=nixpkgs=$(nix build --impure --no-link --print-out-paths --expr '(import ./inputs.nix).nixpkgs')
          export NIX_PATH
          for hook in patches/*/update.sh; do
            [ -e "$hook" ] || continue
            source=$(basename "$(dirname "$hook")")
            echo ">>> $hook"
            "./$hook"
            git add -A "patches/$source"
            git diff --cached --quiet || bash "$RUNNER_TEMP/commit" -m "chore($source): run update hook"
          done

      - name: Open the PR and merge it once CI passes
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse main)" ]; then
            echo "Everything is up to date"
            exit 0
          fi
          git log --format='%h %G? %s' main..HEAD
          git push -q --force origin "$BRANCH"

          auth="Authorization: token $LON_TOKEN"
          pr=$(curl -sf -H "$auth" "$API/pulls?state=open&limit=50" | jq -r --arg b "$BRANCH" '.[] | select(.head.ref == $b) | .number')
          if [ -z "$pr" ]; then
            label=$(curl -sf -H "$auth" "$API/labels?limit=50" | jq '[.[] | select(.name == "lon") | .id]')
            pr=$(curl -sf -X POST -H "$auth" -H "Content-Type: application/json" "$API/pulls" \
              -d "$(jq -n --arg head "$BRANCH" --argjson labels "$label" --arg body "$(git log --reverse --format='%B' main..HEAD)" \
                '{head: $head, base: "main", title: "Update sources", body: $body, labels: $labels}')" \
              | jq -r .number)
            echo "Opened PR #$pr"
          else
            echo "Refreshed PR #$pr"
          fi

          # Scheduling an already scheduled merge may be refused; that is not a failure.
          curl -s -X POST -H "$auth" -H "Content-Type: application/json" "$API/pulls/$pr/merge" \
            -d '{"Do":"fast-forward-only","merge_when_checks_succeed":true,"delete_branch_after_merge":true}' \
            -w '\nmerge scheduling: HTTP %{http_code}\n'
