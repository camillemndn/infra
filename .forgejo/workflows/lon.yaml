name: Update sources

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  lon:
    runs-on: native
    env:
      LON_TOKEN: ${{ secrets.LON_TOKEN }}
      LON_USER_NAME: lon-bot
      LON_USER_EMAIL: lon-bot@git.mndn.fr
      LON_LABELS: lon
      LON_LIST_COMMITS: "10"
      URL: ${{ github.server_url }}/${{ github.repository }}
      API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
    steps:
      - name: Checkout main
        run: |
          git init -q .
          git remote add origin "$URL"
          # The token pushes the update branches. Scoped to Forgejo: lon also queries
          # every upstream over HTTPS, and they must not receive it.
          git config "http.${{ github.server_url }}/.extraHeader" "Authorization: basic $(printf 'x-access-token:%s' "$LON_TOKEN" | base64 -w0)"
          git fetch -q origin main
          git checkout -q -B main FETCH_HEAD

      - name: Set up signing
        env:
          BOT_SSH_KEY: ${{ secrets.BOT_SSH_KEY }}
        run: |
          key=$RUNNER_TEMP/signing-key
          (umask 077 && printf '%s\n' "$BOT_SSH_KEY" > "$key")
          # A per-job global config: the runner's home is shared between jobs.
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
          export GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig
          git config --global user.name "$LON_USER_NAME"
          git config --global user.email "$LON_USER_EMAIL"
          git config --global gpg.format ssh
          git config --global user.signingKey "$key"
          git config --global commit.gpgSign true

      - name: Open update PRs
        # The lon of the repo's own nixpkgs-unstable pin, the one that wrote lon.nix.
        run: nix shell --impure --expr '(import (import ./inputs.nix).nixpkgs-unstable { }).lon' -c lon bot forgejo

      - name: Merge them once CI passes
        run: |
          prs=$(curl -sf -H "Authorization: token $LON_TOKEN" "$API/pulls?state=open&limit=50" \
            | jq -r '.[] | select(any(.labels[]; .name == "lon")) | .number')
          for pr in $prs; do
            echo "PR #$pr: merging fast-forward when checks succeed"
            curl -sf -X POST -H "Authorization: token $LON_TOKEN" -H "Content-Type: application/json" \
              "$API/pulls/$pr/merge" \
              -d '{"Do":"fast-forward-only","merge_when_checks_succeed":true,"delete_branch_after_merge":true}'
          done
