name: Sign key challenge

# Signs the token of Forgejo's SSH key verification with the update bot's key.
on:
  workflow_dispatch:
    inputs:
      challenge:
        description: Token from the Verify page
        type: string
        required: true

jobs:
  sign:
    runs-on: native
    steps:
      - env:
          BOT_SSH_KEY: ${{ secrets.BOT_SSH_KEY }}
          CHALLENGE: ${{ inputs.challenge }}
        run: |
          key=$RUNNER_TEMP/signing-key
          (umask 077 && printf '%s\n' "$BOT_SSH_KEY" > "$key")
          # The namespace is the instance's server.DOMAIN.
          printf '%s' "$CHALLENGE" | ssh-keygen -Y sign -n git.mndn.fr -f "$key"
          rm -f "$key"
